# This is a composition of lint and test scripts
# Make sure to update this file along with the others

name: Test and Release

# Run this job on all pushes and pull requests
# as well as tags with a semantic version
on:
    push:
        branches:
            - main
            - master
        tags:
            # normal versions
            - 'v?[0-9]+.[0-9]+.[0-9]+'
            # pre-releases
            - 'v?[0-9]+.[0-9]+.[0-9]+-**'
    pull_request: {}

# Cancel previous PR/branch runs when a new commit is pushed
concurrency:
    group: ${{ github.ref }}
    cancel-in-progress: true

jobs:
    # Performs quick checks before the expensive test runs
    check-and-lint:
        if: contains(github.event.head_commit.message, '[skip ci]') == false

        runs-on: ubuntu-latest

        steps:
            - uses: ioBroker/testing-action-check@v2
              with:
                  node-version: '24.x'
                  lint: true

            # Runs adapter tests on all supported node versions and OSes
    adapter-tests:
        if: contains(github.event.head_commit.message, '[skip ci]') == false

        needs: [check-and-lint]

        runs-on: ubuntu-latest
        strategy:
            matrix:
                node-version: [22.x, 24.x, 26.x]

        steps:
            - uses: ioBroker/testing-action-adapter@v1.1.2
              with:
                  build: true
                  os: 'ubuntu-latest'
                  node-version: ${{ matrix.node-version }}
                  screenshots-path: 'tmp/screenshots/**/*.png'

    build-and-push:
        needs: [check-and-lint, adapter-tests]
        
        runs-on: ubuntu-latest

        steps:
          - name: Checkout Repository
            uses: actions/checkout@v4

          - name: Setup Node.js
            uses: actions/setup-node@v4
            with:
              node-version: '24'
              cache: 'npm'

          - name: Install dependencies
            run: npm ci

          - name: Build adapter
            run: npm run build

          - name: Push build files to branch
            run: |
              git config --local user.email "github-actions[bot]@users.noreply.github.com"
              git config --local user.name "github-actions[bot]"
          
              # Temporären Branch für den Build anlegen
              git checkout -B build-deploy
          
              # Kompilierte Ordner trotz .gitignore erzwingen (ggf. Pfade anpassen, falls admin/ gebaut wird)
              git add -f build/
          
              # Änderungen committen (ignoriert Fehler, falls sich nichts geändert hat)
              git commit -m "chore: build artifacts for ioBroker [skip ci]" || exit 0
          
              # Branch in das Repository pushen
              git push -f origin build-deploy

